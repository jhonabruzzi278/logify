services:
  postgres-db:
    image: postgres:15-alpine
    container_name: logify-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env (ver .env.example)}
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logify-net

  orders-service:
    build:
      context: ./Backend
      dockerfile: orders-service/Dockerfile
    container_name: logify-orders
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env (ver .env.example)}@postgres-db:5432/orders_db
      # Rol restringido (sin BYPASSRLS) para las queries de request -- ver
      # Backend/shared/rls.js y wiki/Seguridad-y-RLS.md. DB_URL (arriba, rol
      # postgres/superusuario) sigue usandose solo para migraciones al arrancar.
      - DB_RUNTIME_URL=postgresql://app_runtime:${DB_RUNTIME_PASSWORD:?Definí DB_RUNTIME_PASSWORD en tu .env, generalo con openssl rand -base64 32}@postgres-db:5432/orders_db
      - DB_RUNTIME_PASSWORD=${DB_RUNTIME_PASSWORD:?Definí DB_RUNTIME_PASSWORD en tu .env, generalo con openssl rand -base64 32}
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - SHIPPING_SERVICE_URL=http://shipping-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:5173}
      - PORT=8081
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL}
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en tu .env, generalo con openssl rand -base64 48}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - PLATFORM_ADMIN_KEY=${PLATFORM_ADMIN_KEY:-}
      - SIGNUP_RATE_LIMIT_MAX=${SIGNUP_RATE_LIMIT_MAX:-5}
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - logify-net

  inventory-service:
    build:
      context: ./Backend
      dockerfile: inventory-service/Dockerfile
    container_name: logify-inventory
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env (ver .env.example)}@postgres-db:5432/inventory_db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:5173}
      - PORT=8082
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en tu .env, generalo con openssl rand -base64 48}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - PLATFORM_ADMIN_KEY=${PLATFORM_ADMIN_KEY:-}
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - logify-net

  shipping-service:
    build:
      context: ./Backend
      dockerfile: shipping-service/Dockerfile
    container_name: logify-shipping
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env (ver .env.example)}@postgres-db:5432/shipping_db
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:5173}
      - PORT=8084
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL}
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en tu .env, generalo con openssl rand -base64 48}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - PLATFORM_ADMIN_KEY=${PLATFORM_ADMIN_KEY:-}
    ports:
      - "8084:8084"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - logify-net

  notification-service:
    build:
      context: ./Backend
      dockerfile: notification-service/Dockerfile
    container_name: logify-notification
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en tu .env (ver .env.example)}@postgres-db:5432/notification_db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:5173}
      - PORT=8085
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en tu .env, generalo con openssl rand -base64 48}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:logistica@logify.cl}
      - PLATFORM_ADMIN_KEY=${PLATFORM_ADMIN_KEY:-}
    ports:
      - "8085:8085"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - logify-net

  api-gateway:
    image: nginx:alpine
    container_name: logify-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - orders-service
      - inventory-service
      - shipping-service
      - notification-service
    networks:
      - logify-net

networks:
  logify-net:
    driver: bridge

volumes:
  postgres_data:
