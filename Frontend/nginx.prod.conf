server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Assets con hash en el nombre (Vite): cache largo e inmutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker y manifest de la PWA: nunca cachear, deben revalidarse siempre
  location ~* \.(webmanifest|json)$ {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta que no sea un archivo real cae a index.html (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
