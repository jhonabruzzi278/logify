name: Deploy VPS

# Se dispara cuando el workflow "CI" (.github/workflows/ci.yml) termina
# de correr sobre main -- nunca antes de que los tests pasen. Vive en un
# workflow separado (no como job dentro de ci.yml) a proposito: ci.yml
# tiene concurrency con cancel-in-progress=true (cancela runs viejos del
# mismo ref cuando llega uno nuevo), y no queremos que un push nuevo
# pueda matar un deploy a mitad de camino -- este workflow tiene su
# propio grupo de concurrencia, con cancel-in-progress=false (encola en
# vez de cancelar).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    # Corre si lo dispara un push a main con CI en verde, o si alguien
    # lo dispara a mano desde la pestaña Actions (redeploy sin commit
    # nuevo -- ver wiki/Despliegue-VPS.md).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy vía SSH (Backend/scripts/02-vps-deploy.sh)
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          SYNC_ENV_FROM_CI: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
          SUPPORT_WHATSAPP_URL: ${{ secrets.SUPPORT_WHATSAPP_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          PLATFORM_ADMIN_CLERK_USER_IDS: ${{ secrets.PLATFORM_ADMIN_CLERK_USER_IDS }}
          BILLING_DEFAULT_PROVIDER: ${{ secrets.BILLING_DEFAULT_PROVIDER }}
          FLOW_API_KEY: ${{ secrets.FLOW_API_KEY }}
          FLOW_SECRET_KEY: ${{ secrets.FLOW_SECRET_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          # El onboarding central ya aprovisiona Clerk y termina en app.logify.cl.
          # Se sincroniza explícitamente para reemplazar cualquier false legado
          # que haya quedado guardado en el .env del VPS.
          SIGNUP_ENABLED: "true"
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: SYNC_ENV_FROM_CI,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_REPLY_TO,SUPPORT_WHATSAPP_URL,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,CLERK_SECRET_KEY,CLERK_WEBHOOK_SIGNING_SECRET,PLATFORM_ADMIN_CLERK_USER_IDS,BILLING_DEFAULT_PROVIDER,FLOW_API_KEY,FLOW_SECRET_KEY,MERCADOPAGO_ACCESS_TOKEN,SIGNUP_ENABLED
          script: |
            cd ~/logify
            bash Backend/scripts/02-vps-deploy.sh
