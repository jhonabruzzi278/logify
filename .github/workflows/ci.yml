name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - orders-service
          - inventory-service
          - shipping-service
          - notification-service
    defaults:
      run:
        working-directory: Backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  landing:
    name: Landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Landing/package-lock.json
      - run: npm ci
      - run: npm run build

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend, landing]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Cada npm test de backend ya corre con --coverage (jest); Frontend
      # necesita test:coverage explicito (npm test corre vitest sin coverage).
      - run: npm ci && npm test
        working-directory: Backend/orders-service
      - run: npm ci && npm test
        working-directory: Backend/inventory-service
      - run: npm ci && npm test
        working-directory: Backend/shipping-service
      - run: npm ci && npm test
        working-directory: Backend/notification-service
      - run: npm ci && npm run test:coverage
        working-directory: Frontend
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
