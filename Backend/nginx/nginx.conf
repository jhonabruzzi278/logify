worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
      default_type application/json;
      return 200 '{"status":"UP","service":"logify-api-gateway"}';
    }

    location /api/auth {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/customers {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/security {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/settings {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/onboarding {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/orders {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    # Fase 4E del roadmap multi-tenant (ver wiki/Multi-Tenant.md): signup
    # self-service y administracion de cupones, ambos servidos por
    # orders-service (dueno de la tabla tenants).
    location /api/signup {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/admin {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/platform {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Groundwork Clerk (ver ADR-004): POST /api/webhooks/clerk en orders-service,
    # verificado por firma Svix -- sin X-Tenant-Slug porque este endpoint es
    # publico y no pasa por requireTenant.
    location /api/webhooks {
      set $orders_upstream http://orders-service:8081;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/inventory {
      set $inventory_upstream http://inventory-service:8082;
      proxy_pass $inventory_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/sales {
      set $inventory_upstream http://inventory-service:8082;
      proxy_pass $inventory_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/suppliers {
      set $inventory_upstream http://inventory-service:8082;
      proxy_pass $inventory_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/purchases {
      set $inventory_upstream http://inventory-service:8082;
      proxy_pass $inventory_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/cash-sessions {
      set $inventory_upstream http://inventory-service:8082;
      proxy_pass $inventory_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/shipments {
      set $shipping_upstream http://shipping-service:8084;
      proxy_pass $shipping_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location /api/notifications {
      set $notification_upstream http://notification-service:8085;
      proxy_pass $notification_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    }

    location / {
      default_type application/json;
      return 404 '{"message":"Route not found"}';
    }
  }
}
