sonar.organization=jhonabruzzi278
sonar.projectKey=jhonabruzzi278_logify
sonar.projectName=logify

# Sin esto, el scanner adivina la codificacion del runner de CI (no siempre
# UTF-8), lo que dispara el warning "problems with file encoding" con los
# acentos y ñ que abundan en comentarios/strings en español del repo.
sonar.sourceEncoding=UTF-8

sonar.sources=Backend,Frontend/src,Landing
# Los .sql se excluyen del analisis: son PostgreSQL/plpgsql, no Oracle
# PL/SQL. El analizador PLSQL de SonarCloud solo entiende dialecto Oracle y
# sus reglas S3641/S3921/S3618/S3651 dependen de un "Data Dictionary"
# (metadata exportada de una base Oracle real) que no aplica aca -- no hay
# Oracle en este proyecto, asi que configurarlo no es la solucion; excluir
# los .sql del analizador que no les corresponde si lo es.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/e2e/**,**/test-results/**,**/dev-dist/**,**/*.sql

sonar.tests=Backend,Frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=Backend/orders-service/coverage/lcov.info,Backend/inventory-service/coverage/lcov.info,Backend/shipping-service/coverage/lcov.info,Backend/notification-service/coverage/lcov.info,Backend/billing-service/coverage/lcov.info,Frontend/coverage/lcov.info

# El endpoint DELETE /api/admin/tenants/:tenantId/purge se repite casi
# identico en estos 3 servicios a proposito (cada uno tiene su propia base
# de datos -- Postgres no permite FK cross-database -- y su propia lista de
# tablas tenant-scoped). Se evaluo extraer un helper compartido a
# Backend/shared/, pero Jest no instrumenta cobertura de codigo fuera del
# rootDir de cada servicio (confirmado localmente: new_coverage caia de
# 90.5% a 62.5%), asi que la duplicacion queda como tradeoff documentado en
# vez de sacrificar cobertura medible por un DRY cosmetico.
sonar.cpd.exclusions=Backend/inventory-service/src/index.js,Backend/shipping-service/src/index.js,Backend/notification-service/src/index.js

# Backend/orders-service/scripts/*.js son utilidades de un solo disparo
# (correr a mano una vez, no un endpoint ni logica de app -- ver
# migrate-demo-users-to-clerk.js), fuera del collectCoverageFrom de Jest de
# cada servicio (src/**/*.js) igual que Backend/shared/ (ver comentario de
# sonar.cpd.exclusions arriba). Exigirles 80% de cobertura no aporta señal
# real, asi que se excluyen de la metrica en vez de escribir tests
# descartables para un script descartable.
# Redirección SSR de compatibilidad; se valida con el build de Next y no forma
# parte del conjunto de pruebas unitarias de Frontend/src.
sonar.coverage.exclusions=Backend/*/scripts/**,Landing/pages/invite/**
