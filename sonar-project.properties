sonar.organization=jhonabruzzi278
sonar.projectKey=jhonabruzzi278_logify
sonar.projectName=logify

# Sin esto, el scanner adivina la codificacion del runner de CI (no siempre
# UTF-8), lo que dispara el warning "problems with file encoding" con los
# acentos y ñ que abundan en comentarios/strings en español del repo.
sonar.sourceEncoding=UTF-8

sonar.sources=Backend,Frontend/src,Landing
# Los .sql se excluyen del analisis: son PostgreSQL/plpgsql, no Oracle
# PL/SQL. El analizador PLSQL de SonarCloud solo entiende dialecto Oracle y
# sus reglas S3641/S3921/S3618/S3651 dependen de un "Data Dictionary"
# (metadata exportada de una base Oracle real) que no aplica aca -- no hay
# Oracle en este proyecto, asi que configurarlo no es la solucion; excluir
# los .sql del analizador que no les corresponde si lo es.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/e2e/**,**/test-results/**,**/dev-dist/**,**/*.sql

sonar.tests=Backend,Frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=Backend/orders-service/coverage/lcov.info,Backend/inventory-service/coverage/lcov.info,Backend/shipping-service/coverage/lcov.info,Backend/notification-service/coverage/lcov.info,Frontend/coverage/lcov.info
